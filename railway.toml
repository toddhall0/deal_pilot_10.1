[build]
builder = "nixpacks"
buildCommand = "npm run build"

[deploy]
# Try migration, but start app even if it fails (for initial setup)
startCommand = "npm run db:migrate:prod || true && npm run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
